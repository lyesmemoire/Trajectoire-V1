<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background - Premium gradient -->
  <rect width="400" height="400" fill="#F8F6F3"/>
  <rect width="400" height="400" fill="url(#gradient)" opacity="0.5"/>
  
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  
  <!-- Founder figure - Professional portrait -->
  <!-- Head -->
  <ellipse cx="200" cy="140" rx="60" ry="75" fill="#F5D0C5"/>
  
  <!-- Hair - Professional, elegant -->
  <path d="M140 120 Q140 70 200 65 Q260 70 260 120 Q260 95 200 90 Q140 95 140 120" fill="#2C1810"/>
  <!-- Side hair detail -->
  <path d="M140 120 Q145 140 150 160" stroke="#2C1810" stroke-width="8" fill="none"/>
  <path d="M260 120 Q255 140 250 160" stroke="#2C1810" stroke-width="8" fill="none"/>
  
  <!-- Glasses - Elegant, subtle -->
  <rect x="165" y="130" width="35" height="25" fill="none" stroke="#1E293B" stroke-width="2" rx="6"/>
  <rect x="200" y="130" width="35" height="25" fill="none" stroke="#1E293B" stroke-width="2" rx="6"/>
  <line x1="200" y1="142" x2="200" y2="142" stroke="#1E293B" stroke-width="2"/>
  <line x1="165" y1="137" x2="155" y2="132" stroke="#1E293B" stroke-width="2"/>
  <line x1="235" y1="137" x2="245" y2="132" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Eyes - Professional, confident -->
  <ellipse cx="182" cy="142" rx="6" ry="5" fill="#1E293B"/>
  <ellipse cx="218" cy="142" rx="6" ry="5" fill="#1E293B"/>
  <!-- Eye shine -->
  <ellipse cx="184" cy="140" rx="2" ry="1.5" fill="#FFFFFF"/>
  <ellipse cx="220" cy="140" rx="2" ry="1.5" fill="#FFFFFF"/>
  
  <!-- Eyebrows - Natural, professional -->
  <path d="M170 132 Q182 128 194 132" stroke="#2C1810" stroke-width="2.5" fill="none"/>
  <path d="M206 132 Q218 128 230 132" stroke="#2C1810" stroke-width="2.5" fill="none"/>
  
  <!-- Nose - Elegant -->
  <path d="M200 145 L198 165 L205 167" stroke="#E8B4A8" stroke-width="2.5" fill="none"/>
  
  <!-- Mouth - Subtle smile, professional -->
  <path d="M180 185 Q200 192 220 185" stroke="#C97B6B" stroke-width="2.5" fill="none"/>
  
  <!-- Body - Professional attire -->
  <!-- Blouse/shirt collar -->
  <path d="M160 210 L200 235 L240 210" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <path d="M200 235 L200 270" stroke="#E5E7EB" stroke-width="1"/>
  
  <!-- Blazer - Navy blue, premium -->
  <path d="M130 210 L160 210 L200 235 L240 210 L270 210 L270 400 L130 400 Z" fill="#1E3A8A"/>
  
  <!-- Lapel - Elegant detail -->
  <path d="M160 210 L180 260 L200 235" fill="#1E40AF"/>
  <path d="M240 210 L220 260 L200 235" fill="#1E40AF"/>
  
  <!-- Subtle pattern on blazer -->
  <line x1="150" y1="250" x2="150" y2="350" stroke="#1E40AF" stroke-width="1" opacity="0.3"/>
  <line x1="250" y1="250" x2="250" y2="350" stroke="#1E40AF" stroke-width="1" opacity="0.3"/>
  
  <!-- Necklace - Subtle, professional -->
  <path d="M175 215 Q200 230 225 215" stroke="#FFD700" stroke-width="2" fill="none"/>
  <circle cx="200" cy="225" r="4" fill="#FFD700"/>
  
  <!-- Shoulders - Natural -->
  <path d="M130 210 Q100 230 130 280" stroke="#1E3A8A" stroke-width="30" fill="none" stroke-linecap="round"/>
  <path d="M270 210 Q300 230 270 280" stroke="#1E3A8A" stroke-width="30" fill="none" stroke-linecap="round"/>
  
  <!-- Decorative elements - Premium portrait style -->
  <!-- Subtle vignette -->
  <circle cx="200" cy="200" r="180" fill="none" stroke="#1E40AF" stroke-width="1" opacity="0.1"/>
  
  <!-- Accent dots -->
  <circle cx="50" cy="50" r="3" fill="#1E40AF" opacity="0.2"/>
  <circle cx="350" cy="50" r="3" fill="#1E40AF" opacity="0.2"/>
  <circle cx="50" cy="350" r="3" fill="#1E40AF" opacity="0.2"/>
  <circle cx="350" cy="350" r="3" fill="#1E40AF" opacity="0.2"/>
</svg>
