groups:
  - name: Trajectoire_Enterprise_Critical_Outages
    rules:
      - alert: OpenAI_Core_Outage
        expr: increase(trajectoire_finops_circuit_breaker_trips_total{provider=~"openai|llm"}[5m]) > 0 OR (rate(trajectoire_runtime_events{event_type="ai_error"}[5m]) / (rate(trajectoire_runtime_events{event_type="ai_done"}[5m]) + 0.001)) > 0.60
        for: 2m
        labels:
          severity: Critical
          routing: pagerduty
          service: InterviewEngine
        annotations:
          summary: "CRITICAL: OpenAI or core LLM provider outage detected on active runtime cluster."
          description: "Over 60% of LLM inference requests returned errors or tripped the FinOps Redis Circuit Breaker over the last 2 minutes. Automated Fail-Open caching engaged."
          runbook_url: "https://trajectoire.app/runbooks/openai_outage"

      - alert: Deepgram_ASR_Outage
        expr: increase(trajectoire_finops_circuit_breaker_trips_total{provider="deepgram"}[5m]) > 0 OR rate(trajectoire_ws_message_flood{frame_type="stt_error"}[5m]) > 25
        for: 2m
        labels:
          severity: Critical
          routing: pagerduty
          service: RealtimeGateway
        annotations:
          summary: "CRITICAL: Deepgram ASR streaming WebSocket outage intercepted."
          description: "Deepgram live listen connections failing consistently or failing financial authorization. Interactive voice interviews switched to graceful passive text mode."
          runbook_url: "https://trajectoire.app/runbooks/deepgram_outage"

      - alert: ElevenLabs_TTS_Outage
        expr: increase(trajectoire_finops_circuit_breaker_trips_total{provider="elevenlabs"}[5m]) > 0
        for: 3m
        labels:
          severity: Critical
          routing: pagerduty
          service: RealtimeGateway
        annotations:
          summary: "CRITICAL: ElevenLabs TTS synthesis provider outage or daily budget lock tripped."
          description: "ElevenLabs auto breaker tripped or provider unconfigured. High-fidelity voice synthesis falling back seamlessly to in-memory silent binaire WAV audio."
          runbook_url: "https://trajectoire.app/runbooks/elevenlabs_outage"

      - alert: PostgreSQL_Database_Outage
        expr: rate(trajectoire_dbre_supabase_reconnections_total[5m]) > 30 OR up{job=~"postgresql|supabase_pooler"} == 0
        for: 2m
        labels:
          severity: Critical
          routing: pagerduty
          service: Database
        annotations:
          summary: "CRITICAL: PostgreSQL database pool or Supavisor transactional pooler outage."
          description: "Over 30 automatic exponential backoff DB reconnect loops triggered per second or database target completely unreachable. Check max_connections or Supavisor proxy health."
          runbook_url: "https://trajectoire.app/runbooks/postgresql_outage"

      - alert: Redis_Cache_Outage
        expr: up{job=~"redis|upstash"} == 0 OR rate(trajectoire_ws_rate_limit_hits{limit_tier="redis_unavailable"}[5m]) > 50
        for: 2m
        labels:
          severity: Critical
          routing: pagerduty
          service: ObservabilityAndCache
        annotations:
          summary: "CRITICAL: Master Upstash Redis cache & rate-limiting cluster unreachable."
          description: "Redis rate limiters, session uniqueness locks, and FinOps ledger stores failed completely. Ingestion Shield operating in Fail-Open mode."
          runbook_url: "https://trajectoire.app/runbooks/redis_outage"

  - name: Trajectoire_Enterprise_High_TrafficAndPerformance
    rules:
      - alert: P95_Latency_Breach_LLM
        expr: histogram_quantile(0.95, sum(rate(trajectoire_p95_execution_latency_ms_bucket{operation_name=~"callLlmStrict|nextV3Step"}[10m])) by (le, macro_layer, operation_name)) > 2500
        for: 5m
        labels:
          severity: High
          routing: slack_alerts
          service: AIOrchestration
        annotations:
          summary: "HIGH: Core AI ML FSM inference p95 latency breached 2.5 seconds."
          description: "Unacceptable model execution latency observed on highly monitored Zod strict inference loops over the rolling 10-minute window."
          runbook_url: "https://trajectoire.app/runbooks/llm_latency_breach"

      - alert: Silent_Fallback_Explosion
        expr: (rate(trajectoire_finops_cost{service_type="mock_fallback"}[10m]) / (rate(trajectoire_finops_cost[10m]) + 0.001)) * 100.0 > 15.0
        for: 5m
        labels:
          severity: High
          routing: slack_alerts
          service: FinOpsGovernance
        annotations:
          summary: "HIGH: Over 15% of total conversational speech synthesized in silent mock mode."
          description: "Significant explosion of TTS fallback actions intercepted. User experience operating in graceful text mode, indicating potential third-party rate limits or local budget exhaustion."
          runbook_url: "https://trajectoire.app/runbooks/fallback_explosion"

      - alert: WebSocket_Message_Flooding_Attack
        expr: sum(rate(trajectoire_ws_message_flood[5m])) by (endpoint) > 20
        for: 3m
        labels:
          severity: High
          routing: slack_alerts
          service: NetworkSecurity
        annotations:
          summary: "HIGH: Active WebSocket message flooding attack intercepted on {{ $labels.endpoint }}."
          description: "Over 20 conversational sockets terminated per second for violating in-memory Token Bucket refill limits (Code 1008). DDoS defense active."
          runbook_url: "https://trajectoire.app/runbooks/ws_flooding_attack"

      - alert: Upgrade_Rate_Limit_Spikes
        expr: sum(rate(trajectoire_ws_rate_limit_hits[5m])) by (endpoint) > 150
        for: 3m
        labels:
          severity: High
          routing: slack_alerts
          service: EdgeSecurity
        annotations:
          summary: "HIGH: HTTP WebSocket Upgrade handshake Rate Limit spike (>150 req/sec) on {{ $labels.endpoint }}."
          description: "Ingestion Shield rejecting massive bursts of connection Upgrade handshakes with HTTP 429 and 423 under Upstash Redis Sliding Window defense."
          runbook_url: "https://trajectoire.app/runbooks/rate_limit_spikes"

  - name: Trajectoire_Enterprise_MediumAndLow_Warnings
    rules:
      - alert: Database_Increased_Resilient_Retries
        expr: rate(trajectoire_dbre_supabase_reconnections_total[15m]) > 5
        for: 10m
        labels:
          severity: Medium
          routing: slack_tickets
          service: Database
        annotations:
          summary: "MEDIUM: Intermittent database connection drops triggering increased exponential backoff loops."
          description: "Intermittent connection closed or pool timeout exceptions successfully mitigated by DBRE optimizer retries over 15 minutes. Teardown active but threat under control."
          runbook_url: "https://trajectoire.app/runbooks/db_increased_retries"

      - alert: High_Session_Abandonment_Rate
        expr: (sum(rate(trajectoire_ws_connections{endpoint="abandoned"}[15m])) / (sum(rate(trajectoire_ws_connections{endpoint="connected"}[15m])) + 0.001)) > 0.20
        for: 15m
        labels:
          severity: Medium
          routing: slack_tickets
          service: ProductAnalytics
        annotations:
          summary: "MEDIUM: Real-time WebSocket interview abandonment rate exceeded 20%."
          description: "High volume of active users breaking real-time sessions prematurely or closing tabs before natural FSM summary completion. Check client-side WebSocket audio worklet errors."
          runbook_url: "https://trajectoire.app/runbooks/high_abandonment"

      - alert: Error_Budget_Slow_Burn_Warning
        expr: trajectoire_slo_error_budget_remaining_percent < 30.0
        for: 1h
        labels:
          severity: Low
          routing: slack_tickets
          service: SREManagement
        annotations:
          summary: "LOW: 30-Day Error Budget remaining capacity dropped below 30%."
          description: "Non-fatal cumulative slow burn of Service Level Objective error allowances over rolling 30 days. Priority engineering allocation required before total SLO breach."
          runbook_url: "https://trajectoire.app/runbooks/error_budget_warning"
