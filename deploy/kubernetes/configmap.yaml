apiVersion: v1
kind: ConfigMap
metadata:
  name: trajectoire-config
  namespace: trajectoire
data:
  NODE_ENV: "production"
  PORT: "3000"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  JAEGER_ENDPOINT: "http://jaeger-collector:4317"
