apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: trajectoire-vault
  namespace: trajectoire
spec:
  provider:
    vault:
      server: "https://vault.example.com"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "auth/kubernetes"
          role: "trajectoire"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: trajectoire-secrets
  namespace: trajectoire
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: trajectoire-vault
    kind: SecretStore
  target:
    name: trajectoire-secrets
    creationPolicy: Owner
  data:
  - secretKey: POSTGRES_USER
    remoteRef:
      key: trajectoire/postgres
      property: user
  - secretKey: POSTGRES_PASSWORD
    remoteRef:
      key: trajectoire/postgres
      property: password
  - secretKey: POSTGRES_DB
    remoteRef:
      key: trajectoire/postgres
      property: database
  - secretKey: REDIS_PASSWORD
    remoteRef:
      key: trajectoire/redis
      property: password
  - secretKey: OPENAI_API_KEY
    remoteRef:
      key: trajectoire/openai
      property: apiKey
  - secretKey: JWT_SECRET
    remoteRef:
      key: trajectoire/jwt
      property: secret
  - secretKey: GRAFANA_ADMIN_USER
    remoteRef:
      key: trajectoire/grafana
      property: adminUser
  - secretKey: GRAFANA_ADMIN_PASSWORD
    remoteRef:
      key: trajectoire/grafana
      property: adminPassword
