apiVersion: v1
kind: Secret
metadata:
  name: {{ include "trajectoire.fullname" . }}-secrets
  labels:
    {{- include "trajectoire.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secrets.postgres.user }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgres.password }}
  POSTGRES_DB: {{ .Values.secrets.postgres.database }}
  REDIS_PASSWORD: {{ .Values.secrets.redis.password }}
  OPENAI_API_KEY: {{ .Values.secrets.openai.apiKey }}
  JWT_SECRET: {{ .Values.secrets.jwt.secret }}
  GRAFANA_ADMIN_USER: {{ .Values.secrets.grafana.adminUser }}
  GRAFANA_ADMIN_PASSWORD: {{ .Values.secrets.grafana.adminPassword }}
