{{- if .Values.monitoring.enabled }}
{{- if .Values.monitoring.prometheus.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trajectoire.fullname" . }}-prometheus
  labels:
    {{- include "trajectoire.labels" . | nindent 4 }}
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "trajectoire.selectorLabels" . | nindent 6 }}
      app: prometheus
  template:
    metadata:
      labels:
        {{- include "trajectoire.selectorLabels" . | nindent 8 }}
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        ports:
        - containerPort: 9090
        args:
        - '--config.file=/etc/prometheus/prometheus.yml'
        - '--storage.tsdb.path=/prometheus'
        - '--web.console.libraries=/etc/prometheus/console_libraries'
        - '--web.console.templates=/etc/prometheus/consoles'
        - '--storage.tsdb.retention.time=200h'
        - '--web.enable-lifecycle'
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus
        - name: prometheus-storage
          mountPath: /prometheus
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      volumes:
      - name: prometheus-config
        configMap:
          name: {{ include "trajectoire.fullname" . }}-prometheus-config
      - name: prometheus-storage
        persistentVolumeClaim:
          claimName: {{ include "trajectoire.fullname" . }}-prometheus-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "trajectoire.fullname" . }}-prometheus
  labels:
    {{- include "trajectoire.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "trajectoire.selectorLabels" . | nindent 4 }}
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "trajectoire.fullname" . }}-prometheus-pvc
  labels:
    {{- include "trajectoire.labels" . | nindent 4 }}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.monitoring.prometheus.persistence.size }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "trajectoire.fullname" . }}-prometheus-config
  labels:
    {{- include "trajectoire.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
    - job_name: 'trajectoire-api'
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
          - {{ .Release.Namespace }}
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: {{ include "trajectoire.name" . }}
      - source_labels: [__meta_kubernetes_pod_ip]
        target_label: __address__
        replacement: $1:9464
{{- end }}
{{- if .Values.monitoring.grafana.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trajectoire.fullname" . }}-grafana
  labels:
    {{- include "trajectoire.labels" . | nindent 4 }}
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "trajectoire.selectorLabels" . | nindent 6 }}
      app: grafana
  template:
    metadata:
      labels:
        {{- include "trajectoire.selectorLabels" . | nindent 8 }}
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:latest
        ports:
        - containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "trajectoire.fullname" . }}-secrets
              key: GRAFANA_ADMIN_USER
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "trajectoire.fullname" . }}-secrets
              key: GRAFANA_ADMIN_PASSWORD
        - name: GF_USERS_ALLOW_SIGN_UP
          value: "false"
        volumeMounts:
        - name: grafana-storage
          mountPath: /var/lib/grafana
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: grafana-storage
        persistentVolumeClaim:
          claimName: {{ include "trajectoire.fullname" . }}-grafana-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "trajectoire.fullname" . }}-grafana
  labels:
    {{- include "trajectoire.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "trajectoire.selectorLabels" . | nindent 4 }}
    app: grafana
  ports:
  - port: 3000
    targetPort: 3000
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "trajectoire.fullname" . }}-grafana-pvc
  labels:
    {{- include "trajectoire.labels" . | nindent 4 }}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.monitoring.grafana.persistence.size }}
{{- end }}
{{- if .Values.monitoring.jaeger.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trajectoire.fullname" . }}-jaeger
  labels:
    {{- include "trajectoire.labels" . | nindent 4 }}
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "trajectoire.selectorLabels" . | nindent 6 }}
      app: jaeger
  template:
    metadata:
      labels:
        {{- include "trajectoire.selectorLabels" . | nindent 8 }}
        app: jaeger
    spec:
      containers:
      - name: jaeger
        image: jaegertracing/all-in-one:latest
        ports:
        - containerPort: 4317
        - containerPort: 16686
        - containerPort: 14268
        env:
        - name: COLLECTOR_OTLP_ENABLED
          value: "true"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "trajectoire.fullname" . }}-jaeger
  labels:
    {{- include "trajectoire.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "trajectoire.selectorLabels" . | nindent 4 }}
    app: jaeger
  ports:
  - name: otlp
    port: 4317
    targetPort: 4317
  - name: ui
    port: 16686
    targetPort: 16686
  - name: collector
    port: 14268
    targetPort: 14268
  type: ClusterIP
{{- end }}
{{- end }}
