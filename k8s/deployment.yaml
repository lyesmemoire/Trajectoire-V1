apiVersion: apps/v1
kind: Deployment
metadata:
  name: trajectoire-web
  labels:
    app: trajectoire
    component: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: trajectoire
      component: web
  template:
    metadata:
      labels:
        app: trajectoire
        component: web
    spec:
      containers:
      - name: web
        image: trajectoire/web:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: NEXT_TELEMETRY_DISABLED
          value: "1"
        envFrom:
        - configRef:
            name: trajectoire-config
        - secretRef:
            name: trajectoire-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
      terminationGracePeriodSeconds: 30