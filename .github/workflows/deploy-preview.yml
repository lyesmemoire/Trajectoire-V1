name: Deploy Preview

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

jobs:
  deploy-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build application
        run: npm run build

      - name: Build Docker image
        run: |
          docker build -t trajectoire-preview:${{ github.sha }} -f apps/api/Dockerfile .
          docker tag trajectoire-preview:${{ github.sha }} trajectoire-preview:latest

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        run: |
          docker push trajectoire-preview:${{ github.sha }}
          docker push trajectoire-preview:latest

      - name: Deploy to Preview Environment
        run: |
          # Deploy to preview environment (e.g., Vercel, AWS ECS, etc.)
          # This is a placeholder for actual deployment logic
          echo "Deploying to preview environment..."
          echo "PR Number: ${{ github.event.pull_request.number }}"
          echo "Commit SHA: ${{ github.sha }}"

      - name: Run health check
        run: |
          # Wait for deployment to be ready
          sleep 30
          # Run health check
          curl -f https://preview-${{ github.event.pull_request.number }}.trajectoire.com/health || exit 1

      - name: Comment PR with deployment URL
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Preview deployment successful!\n\nURL: https://preview-${{ github.event.pull_request.number }}.trajectoire.com\nCommit: ${{ github.sha }}`
            })
