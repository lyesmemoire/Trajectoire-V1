name: AI Quality Validation

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'scripts/ai-quality-validation.ts'
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ai-quality-validation.yml'
  push:
    branches: [ main, develop ]
    paths:
      - 'scripts/ai-quality-validation.ts'
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ai-quality-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: TypeScript compilation
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
        run: |
          pnpm build

      - name: Run AI Quality Validation
        run: |
          pnpm exec tsx scripts/ai-quality-validation.ts
        env:
          CURRENT_VERSION: ${{ github.sha }}
          PREVIOUS_VERSION: ${{ github.event.before }}
          SIMULATIONS: 100
          FAIL_ON_REGRESSION: false
          OUTPUT_FORMAT: json

      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: validation-results.json

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const results = JSON.parse(fs.readFileSync('validation-results.json', 'utf8'));
              const body = `
              ## AI Quality Validation Results
              
              **Version**: ${results.version}
              **Previous Version**: ${results.previousVersion}
              
              ### Scores
              - Overall Score: ${results.overallScore.toFixed(2)}
              - Previous Score: ${results.previousScore.toFixed(2)}
              - Score Delta: ${results.scoreDelta > 0 ? '+' : ''}${results.scoreDelta.toFixed(2)}
              
              ### Status
              ${results.success ? '✅ PASSED' : '❌ FAILED'}
              
              ### Failures
              ${results.failures.length > 0 ? results.failures.map(f => `- ${f}`).join('\n') : 'None'}
              
              ${results.success ? '✅ Deployment approved' : '❌ Deployment blocked'}
              `;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } catch (error) {
              console.log('Could not read validation results');
            }
