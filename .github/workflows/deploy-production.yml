name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-production:
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://api.trajectoire.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Run lint
        run: npm run lint

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build application
        run: npm run build

      - name: Build Docker image
        run: |
          docker build -t trajectoire:${{ github.sha }} -f apps/api/Dockerfile .
          docker tag trajectoire:${{ github.sha }} trajectoire:latest
          docker tag trajectoire:${{ github.sha }} trajectoire:production

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        run: |
          docker push trajectoire:${{ github.sha }}
          docker push trajectoire:latest
          docker push trajectoire:production

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Deploy to Production
        run: |
          # Deploy to production (e.g., AWS ECS, Kubernetes, etc.)
          # This is a placeholder for actual deployment logic
          echo "Deploying to production..."
          echo "Commit SHA: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"

      - name: Wait for deployment
        run: sleep 60

      - name: Run health check
        run: |
          curl -f https://api.trajectoire.com/health || exit 1

      - name: Run smoke tests
        run: |
          # Run smoke tests against production
          npm run test:smoke

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release v${{ github.run_number }}
          body: |
            Production deployment successful
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Notify team
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Production deployment completed'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        if: always()
