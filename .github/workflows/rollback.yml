name: Rollback

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rollback to (Docker image tag)'
        required: true
        type: string
      environment:
        description: 'Environment to rollback (production/staging)'
        required: true
        type: choice
        options:
          - production
          - staging

jobs:
  rollback:
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.event.inputs.environment }}
      url: https://api.trajectoire.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull previous version
        run: |
          docker pull trajectoire:${{ github.event.inputs.version }}

      - name: Rollback database
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          # Rollback to previous migration
          npx prisma migrate resolve --rolled-back "${{ github.event.inputs.version }}"

      - name: Deploy previous version
        run: |
          # Deploy previous version
          echo "Rolling back to version ${{ github.event.inputs.version }}"
          # This is a placeholder for actual rollback logic
          # e.g., kubectl rollout undo deployment/trajectoire --to-revision=<revision>

      - name: Wait for deployment
        run: sleep 60

      - name: Run health check
        run: |
          curl -f https://api.trajectoire.com/health || exit 1


      - name: Notify team
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: "Rollback to version ${{ github.event.inputs.version }} completed"
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        if: always()

      - name: Create rollback issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Rollback to version ${{ github.event.inputs.version }}`,
              body: `Rollback to version ${{ github.event.inputs.version }} completed successfully.\n\nEnvironment: ${{ github.event.inputs.environment }}\nTriggered by: @${{ github.actor }}`,
              labels: ['rollback', 'incident']
            })
