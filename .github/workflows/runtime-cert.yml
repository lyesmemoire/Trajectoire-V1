name: Runtime Certification Gate

on:
  push:
    paths:
      - 'apps/realtime-gateway/**'
      - 'docs/runtime/**'
      - '.github/workflows/runtime-cert.yml'
  pull_request:
    paths:
      - 'apps/realtime-gateway/**'
      - 'docs/runtime/**'
      - '.github/workflows/runtime-cert.yml'

jobs:
  certify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22


      - name: Install gateway dependencies
        run: npm ci
        working-directory: ./apps/realtime-gateway

      - name: Run full certification
        run: npm run cert:full
        working-directory: ./apps/realtime-gateway

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-audit
          path: docs/runtime/runtime-audit.md
