name: StudioEntretien CI

on:
  push:
    branches:
      - main
      - staging
      - dev

  pull_request:
    branches:
      - main
      - staging

jobs:
  security-and-build:
    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript Check (root)
        run: npx tsc --noEmit

      - name: TypeScript Check (API)
        run: npm run type-check:tests:api

      - name: TypeScript Check (Gateway)
        run: npm run type-check:tests:gateway

      - name: ESLint
        run: npm run lint --if-present
        env:
          CI: true

      - name: Build Next.js
        run: npm run build

      - name: Run Security Audit
        run: npm audit --audit-level=high

      - name: Detect Secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
